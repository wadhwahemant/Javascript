<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body style="background-color: #212121; color: #ffffff;">
    <hi>Hello</hi>
    <button>Get Gender directly from https://randomuser.me/api/ API</button>
</body>
<script>
    const button = document.querySelector('button')
    button.addEventListener('click', function (e) {
        e.preventDefault();
        const source = 'https://randomuser.me/api/'
        const xhr = new XMLHttpRequest()
        xhr.open('GET', source)
        xhr.onreadystatechange = function () {
            console.log(xhr.readyState);
            if (xhr.readyState === 4) {
                const data = JSON.parse(this.responseText)
                console.log(data);
                console.log(data.results[0].gender);
                document.querySelector('body').innerHTML = `<h1>${data.results[0].gender}</h1>`
            }
        }
        xhr.send()
    })
</script>

</html>
